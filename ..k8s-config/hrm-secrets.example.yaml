# Copy to hrm-secrets.local.yaml, replace CHANGE_ME, and never commit that local file.
apiVersion: v1
kind: Secret
metadata:
  name: hrm-api-secrets
  namespace: dev-is
type: Opaque
stringData:
  ConnectionStrings__HrDatabase: "CHANGE_ME"
  AzureAd__ClientSecret: "CHANGE_ME"
  LocalJwt__SigningKey: "CHANGE_ME_AT_LEAST_32_CHARACTERS"
  LOTUS_NOTES_ENDPOINT: "CHANGE_ME"
  LOTUS_NOTES_USERNAME: "CHANGE_ME"
  LOTUS_NOTES_PASSWORD: "CHANGE_ME"
  LOTUS_NOTES_DATABASE: "Employee"
---
apiVersion: v1
kind: Secret
metadata:
  name: hrm-worker-secrets
  namespace: dev-is
type: Opaque
stringData:
  ConnectionStrings__HrDatabase: "CHANGE_ME"
  ConnectionStrings__HikvisionDatabase: "CHANGE_ME"
  ConnectionStrings__WifiAttendanceDatabase: "CHANGE_ME"
