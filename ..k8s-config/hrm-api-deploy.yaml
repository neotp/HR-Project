apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrm-api
  namespace: dev-is
  labels:
    app: hrm-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hrm-api
  template:
    metadata:
      labels:
        app: hrm-api
    spec:
      imagePullSecrets:
        - name: ghcr-hrm-secret
      containers:
        - name: hrm-api
          image: ghcr.io/neotp/hr-project-backend:28.09.2026-v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            # Database Configuration
            # Server: 172.17.17.103 | Database: hrm_db
            # The complete connection string is loaded from Kubernetes Secret.
            - name: ConnectionStrings__HrDatabase
              valueFrom:
                secretKeyRef:
                  name: hrm-api-secrets
                  key: ConnectionStrings__HrDatabase

            # Azure AD Configuration
            - name: AzureAd__TenantId
              value: "fcaf82c9-bebd-47e6-b057-5dce01865032"
            - name: AzureAd__ClientId
              value: "da6648e6-17b3-408b-8fc0-bf570f846ae7"
            - name: AzureAd__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: hrm-api-secrets
                  key: AzureAd__ClientSecret
            - name: AzureAd__Scope
              value: "users.read"

            # Authentication Configuration
            - name: LocalJwt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: hrm-api-secrets
                  key: LocalJwt__SigningKey

            # Frontend and CORS Configuration
            - name: Application__ClientBaseUrl
              value: "https://webapp.sisthai.com/Hrmsystem-web"
            - name: Cors__AllowedOrigins__0
              value: "https://webapp.sisthai.com"

            # Outlook / Microsoft Graph Configuration
            - name: OutlookCalendar__Enabled
              value: "true"
            - name: OutlookCalendar__TimeZone
              value: "SE Asia Standard Time"
            - name: OutlookCalendar__RetryIntervalMinutes
              value: "5"
            - name: OutlookCalendar__CompanyCalendarEnabled
              value: "true"
            - name: OutlookCalendar__CompanyCalendarRetryIntervalSeconds
              value: "60"
            - name: OutlookCalendar__CompanyCalendarBatchSize
              value: "50"
            - name: OutlookCalendar__CompanyCalendarParallelism
              value: "4"
            - name: OutlookCalendar__AttendanceEventEnabled
              value: "true"
            - name: OutlookCalendar__AttendanceEventRetryIntervalSeconds
              value: "60"

            # Lotus Notes Configuration
            - name: LOTUS_NOTES_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: hrm-api-secrets
                  key: LOTUS_NOTES_ENDPOINT
            - name: LOTUS_NOTES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hrm-api-secrets
                  key: LOTUS_NOTES_USERNAME
            - name: LOTUS_NOTES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hrm-api-secrets
                  key: LOTUS_NOTES_PASSWORD
            - name: LOTUS_NOTES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: hrm-api-secrets
                  key: LOTUS_NOTES_DATABASE

            # ASP.NET Core Settings
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health/database
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hrm-api
  namespace: dev-is
  labels:
    app: hrm-api
spec:
  type: ClusterIP
  selector:
    app: hrm-api
  ports:
    - name: http
      port: 5002
      targetPort: 8080  # container port
      protocol: TCP
